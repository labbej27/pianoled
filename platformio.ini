; Bandeau LED d'apprentissage du piano — Yamaha MX49 + ESP32
; Phase 2 : lecture de fichiers MIDI, interface web, modes démo et attente.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

; Partition « huge_app » : 3 Mo pour le programme, ~900 Ko de LittleFS pour les .mid
; (la NVS reste à la même adresse : les réglages de la phase 1 sont conservés)
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

; Téléversement : port du CP2102, vitesse réduite (460 800 bauds donnait des erreurs de liaison)
upload_port = /dev/cu.usbserial-0001   ; à adapter (pio device list), ou supprimer pour la détection automatique
upload_speed = 115200

; Moniteur série : 115 200 bauds, écho local, envoi de la ligne à l'appui sur Entrée
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = esp32_exception_decoder, send_on_enter

lib_deps =
    fastled/FastLED@3.9.16
    fortyseveneffects/MIDI Library@5.0.2
    ESP32Async/AsyncTCP@3.6.1
    ESP32Async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.3

build_flags =
    ; Wi-Fi et serveur web sur le cœur 0 ; loop() (lecture, MIDI, LED) reste sur le cœur 1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; Tests unitaires de l'analyseur MIDI sur PC : pio test -e native
; (régénérer les fichiers d'exemple : python3 outils/generer_midi_test.py)
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -DDOSSIER_FICHIERS_TEST=\"${PROJECT_DIR}/test/fichiers\"
